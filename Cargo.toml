[workspace]
resolver = "2"
members = [
    "crates/oz-cli",
    "crates/oz-core",
    "crates/oz-cow",
    "crates/oz-vfsd",
    "crates/oz-warm",
    "crates/oz-oplog",
    "crates/oz-integrate",
    "crates/oz-github",
    "crates/oz-agent",
    "crates/oz-cloud-api",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaalix/git-ozone"
homepage = "https://gaalix.github.io/git-ozone/"

[workspace.dependencies]
# Internal workspace crates
oz-core = { path = "crates/oz-core" }
oz-cow = { path = "crates/oz-cow" }
oz-vfsd = { path = "crates/oz-vfsd" }
oz-warm = { path = "crates/oz-warm" }
oz-oplog = { path = "crates/oz-oplog" }
oz-integrate = { path = "crates/oz-integrate" }
oz-github = { path = "crates/oz-github" }
oz-agent = { path = "crates/oz-agent" }
oz-cloud-api = { path = "crates/oz-cloud-api" }

# Pure-Rust Git & Diff
gix = { version = "0.90", default-features = false, features = ["basic", "blob-diff", "dirwalk", "excludes", "index", "merge", "revision", "serde", "sha1", "status", "worktree-mutation"] }
gix-protocol = { version = "0.68", default-features = false, features = ["handshake", "serde", "sha1"] }
gix-transport = { version = "0.62", default-features = false, features = ["blocking-client", "http-client-insecure-credentials", "http-client-reqwest-rust-tls", "serde"] }
gix-pack = { version = "0.77", default-features = false, features = ["generate", "serde", "sha1", "streaming-input"] }
gix-packetline = { version = "0.24", default-features = false, features = ["blocking-io"] }
gix-credentials = { version = "0.42", default-features = false, features = ["serde"] }
imara-diff = "0.2"

# HTTP, Compression & Encoding (Pure-Rust / rustls)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "rustls"] }
flate2 = "1.1"
base64 = "0.22"
bytes = "1.12"
http = "1"
url = "2.5"

# Pure-Rust FUSE3 & CoW
fuser = { version = "0.18", default-features = false }
reflink-copy = "0.1"

# CLI, Serialization & Config
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"

# Hashing, Parallelism & Async Runtime
blake3 = "1.8"
rayon = "1.12"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "process"] }

# Error Handling & System Utilities
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
fs4 = "1.1"
tempfile = "3.27"
filetime = "0.2"
walkdir = "2.5"
ignore = "0.4"
globset = "0.4"
ulid = "3.0"
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1.12"
