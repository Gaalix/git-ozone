[workspace]
resolver = "2"
members = [
    "crates/oz-cli",
    "crates/oz-core",
    "crates/oz-cow",
    "crates/oz-vfsd",
    "crates/oz-warm",
    "crates/oz-oplog",
    "crates/oz-integrate",
    "crates/oz-github",
    "crates/oz-agent",
    "crates/oz-cloud-api",
]

[workspace.package]
version = "1.4.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaalix/git-ozone"
readme = "README.md"
keywords = ["git", "vcs", "workspace", "fuse", "ai-agents"]
categories = ["development-tools", "command-line-utilities"]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Keep unwind so `catch_hresult` FFI unwind boundaries in `oz-vfsd/src/projfs.rs` work on Windows.
panic = "unwind"

[workspace.dependencies]
# Internal workspace crates
oz-core = { path = "crates/oz-core" }
oz-cow = { path = "crates/oz-cow" }
oz-vfsd = { path = "crates/oz-vfsd" }
oz-warm = { path = "crates/oz-warm" }
oz-oplog = { path = "crates/oz-oplog" }
oz-integrate = { path = "crates/oz-integrate" }
oz-github = { path = "crates/oz-github" }
oz-agent = { path = "crates/oz-agent" }

# Pure-Rust Git & Diff
gix = { version = "0.90", default-features = false, features = ["basic", "blob-diff", "dirwalk", "excludes", "index", "merge", "revision", "serde", "sha1", "status", "worktree-mutation"] }
gix-transport = { version = "0.62", default-features = false, features = ["blocking-client", "http-client-insecure-credentials", "http-client-reqwest-rust-tls", "serde"] }
gix-pack = { version = "0.77", default-features = false, features = ["generate", "serde", "sha1", "streaming-input"] }
gix-packetline = { version = "0.24", default-features = false, features = ["blocking-io"] }

# HTTP, Compression & Encoding (Pure-Rust / rustls)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "http2", "json", "rustls"] }
flate2 = "1.1"
base64 = "0.23"
http = "1"
url = "2.5"

# Pure-Rust FUSE3 & CoW
fuser = { version = "0.18", default-features = false }
reflink-copy = "0.1"

# CLI, Serialization & Config
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"

# Hashing, Cryptography, Parallelism & Async Runtime
blake3 = "1.8"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
sha2 = "0.10"
zeroize = "1.8"
rayon = "1.12"
tokio = { version = "1.54", features = ["rt"] }

# Error Handling & System Utilities
thiserror = "2.0"
libc = "0.2"
fs4 = "1.1"
tempfile = "3.27"
filetime = "0.2"
walkdir = "2.5"
ignore = "0.4"
globset = "0.4"
regex-automata = { version = "0.4", default-features = false, features = ["meta", "syntax", "perf", "unicode-word-boundary"] }
regex-syntax = "0.8"
ulid = "3.0"
chrono = { version = "0.4", features = ["serde"] }

# Testing
proptest = "1.12"
