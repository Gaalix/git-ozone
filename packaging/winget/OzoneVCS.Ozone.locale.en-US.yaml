ShortDescription: Pure-Rust CoW Git client and multi-agent workspace engine
Description: |-
  Ozone (oz / git-ozone / oz-vfsd) is a cross-platform, GitHub-compatible
  pure-Rust Git client designed for zero-bloat parallel coding agent workspaces.
  On Windows, Ozone supports instant copy-on-write workspaces on ReFS Dev Drives
  and standard NTFS via Windows Projected File System (ProjFS, enabled via
  `oz setup`), warm build caches, stage-free hunk commits, sub-10ms MVCC undo,
  collision radar, native GitHub stacked PRs, and a built-in MCP server.
