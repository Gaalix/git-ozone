name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.4.5); defaults to Cargo.toml workspace version"
        required: false
        type: string
      publish:
        description: "Publish GitHub Release (keep false for dry-run artifact builds)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pure-rust-guard:
    name: Verify pure-Rust Cargo.lock & packaging
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      tag: ${{ steps.resolve-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.lock for forbidden C bindings
        run: |
          set -euo pipefail
          forbidden=(
            'name = "openssl-sys"'
            'name = "libgit2-sys"'
            'name = "curl-sys"'
            'name = "fuse-sys"'
            'name = "libfuse"'
          )
          for pat in "${forbidden[@]}"; do
            if grep -Fq "$pat" Cargo.lock; then
              echo "ERROR: Forbidden C dependency found in Cargo.lock: $pat"
              exit 1
            fi
          done
          echo "OK: Cargo.lock is free of openssl-sys, libgit2-sys, curl-sys, and libfuse/fuse-sys bindings."

      - name: Resolve and verify release version
        id: resolve-version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(
            python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["workspace"]["package"]["version"])
          PY
          )"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [[ "$version" != "$cargo_version" ]]; then
              echo "ERROR: Git tag '$tag' (version '$version') does not match Cargo.toml workspace version '$cargo_version'."
              exit 1
            fi
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
            version="${tag#v}"
          else
            version="$cargo_version"
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag=${tag} version=${version}"

      - name: Validate packaging templates (pre-build)
        run: |
          set -euo pipefail
          python3 -c "import yaml" >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml)
          # Checked-in templates still have placeholder SHA256s prior to building archives;
          # strict checksum verification runs in the `release` job after populate-manifests.py.
          ./packaging/validate.sh --allow-placeholders

  build:
    name: Build & Package (${{ matrix.target }})
    needs: pure-rust-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            deb_arch: amd64
            cross_linux_arm64: false
            native_smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            deb_arch: arm64
            cross_linux_arm64: true
            native_smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            deb_arch: ""
            cross_linux_arm64: false
            native_smoke: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            deb_arch: ""
            cross_linux_arm64: false
            native_smoke: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            deb_arch: ""
            cross_linux_arm64: false
            native_smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux ARM64 cross-linker (pure-Rust FUSE3, no libfuse3-dev)
        if: matrix.cross_linux_arm64
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p oz-cli -p oz-vfsd --bin oz --bin git-ozone --bin oz-vfsd

      - name: Smoke-test native release binaries (Unix)
        if: matrix.native_smoke && matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          "$bin_dir/oz" --version --json | grep -q '"schema": "oz.v1"'
          "$bin_dir/git-ozone" --version --json | grep -q '"schema": "oz.v1"'
          "$bin_dir/oz-vfsd" --help >/dev/null

      - name: Smoke-test native release binaries (Windows)
        if: matrix.native_smoke && matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = "target\${{ matrix.target }}\release"
          $ver = & "$binDir\oz.exe" --version --json | Out-String
          if ($ver -notmatch '"schema": "oz.v1"') { throw "Unexpected oz --version --json output: $ver" }
          $aliasVer = & "$binDir\git-ozone.exe" --version --json | Out-String
          if ($aliasVer -notmatch '"schema": "oz.v1"') { throw "Unexpected git-ozone --version --json output: $aliasVer" }
          & "$binDir\oz-vfsd.exe" --help | Out-Null

      - name: Package Unix tarball (.tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ needs.pure-rust-guard.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin_dir="target/${TARGET}/release"
          if [[ "${{ matrix.cross_linux_arm64 }}" == "true" ]]; then
            aarch64-linux-gnu-strip "$bin_dir/oz" "$bin_dir/git-ozone" "$bin_dir/oz-vfsd"
          else
            strip "$bin_dir/oz" "$bin_dir/git-ozone" "$bin_dir/oz-vfsd"
          fi

          pkg_name="oz-v${VERSION}-${TARGET}"
          stage_dir="dist/stage/${pkg_name}"
          mkdir -p "$stage_dir" dist/out
          install -m 0755 "$bin_dir/oz" "$stage_dir/oz"
          install -m 0755 "$bin_dir/git-ozone" "$stage_dir/git-ozone"
          install -m 0755 "$bin_dir/oz-vfsd" "$stage_dir/oz-vfsd"
          cp LICENSE-MIT LICENSE-APACHE "$stage_dir/"
          if [[ -f README.md ]]; then
            cp README.md "$stage_dir/"
          fi

          tar -C dist/stage -czf "dist/out/${pkg_name}.tar.gz" "${pkg_name}"
          ls -lh "dist/out/${pkg_name}.tar.gz"

      - name: Build Debian package (.deb)
        if: matrix.deb_arch != ''
        shell: bash
        env:
          VERSION: ${{ needs.pure-rust-guard.outputs.version }}
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          set -euo pipefail
          ./packaging/deb/build-deb.sh \
            --version "${VERSION}" \
            --arch "${DEB_ARCH}" \
            --bin-dir "target/${TARGET}/release" \
            --out-dir "dist/out"

      - name: Package Windows archive (.zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.pure-rust-guard.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $binDir = "target\$env:TARGET\release"
          $pkgName = "oz-v$env:VERSION-$env:TARGET"
          $stageDir = Join-Path "dist\stage" $pkgName
          New-Item -ItemType Directory -Force -Path $stageDir, "dist\out" | Out-Null

          Copy-Item "$binDir\oz.exe" $stageDir
          Copy-Item "$binDir\git-ozone.exe" $stageDir
          Copy-Item "$binDir\oz-vfsd.exe" $stageDir
          Copy-Item "LICENSE-MIT", "LICENSE-APACHE" $stageDir
          if (Test-Path "README.md") {
            Copy-Item "README.md" $stageDir
          }

          $zipPath = "dist\out\$pkgName.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force
          Get-Item $zipPath | Select-Object Name, Length

      - name: Upload target artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/out/*
          if-no-files-found: error

  release:
    name: Checksums, Attestations & Publish Release
    needs: [pure-rust-guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum oz-v*.tar.gz oz-v*.zip ozone_*.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Populate and strictly validate Homebrew & winget manifests
        shell: bash
        env:
          VERSION: ${{ needs.pure-rust-guard.outputs.version }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml)
          python3 -B ./packaging/populate-manifests.py \
            --version "${VERSION}" \
            --checksums dist/SHA256SUMS.txt \
            --out-dir dist
          ./packaging/validate.sh \
            --strict \
            --version "${VERSION}" \
            --homebrew dist/oz.rb \
            --winget-dir dist/winget \
            --checksums dist/SHA256SUMS.txt

      - name: Install Cosign for keyless OIDC signing
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS.txt with Cosign (OIDC keyless)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            dist/SHA256SUMS.txt

      - name: Generate GitHub SLSA Build Provenance Attestations
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/oz-v*.tar.gz
            dist/oz-v*.zip
            dist/ozone_*.deb
            dist/SHA256SUMS.txt

      - name: Upload consolidated release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ozone-release-${{ needs.pure-rust-guard.outputs.tag }}
          path: dist
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.pure-rust-guard.outputs.tag }}
          name: Ozone ${{ needs.pure-rust-guard.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.pure-rust-guard.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/oz-v*.tar.gz
            dist/oz-v*.zip
            dist/ozone_*.deb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sigstore.json
            dist/oz.rb
            dist/winget/OzoneVCS.Ozone.yaml
            dist/winget/OzoneVCS.Ozone.installer.yaml
            dist/winget/OzoneVCS.Ozone.locale.en-US.yaml
